input {
  beats {
    port => 5044
    type => "beats"
  }
  
  # For direct file ingestion of sample data
  file {
    path => "/sample-data/*.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    type => "sample_json"
  }
  
  file {
    path => "/sample-data/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    type => "sample_log"
  }
}

filter {
  # Parse Windows Event Logs
  if [type] == "wineventlog" or [winlog] {
    
    # Extract common fields
    mutate {
      add_field => {
        "event_source" => "windows"
        "log_type" => "wineventlog"
      }
    }
    
    # Parse Sysmon events
    if [winlog][provider_name] == "Microsoft-Windows-Sysmon" {
      mutate {
        add_field => { "sysmon_event" => "true" }
      }
      
      # Process creation (Event ID 1)
      if [winlog][event_id] == 1 {
        mutate {
          add_field => { 
            "apt_category" => "process_execution"
            "mitre_tactic" => "Execution"
          }
        }
      }
      
      # Network connection (Event ID 3)
      if [winlog][event_id] == 3 {
        mutate {
          add_field => { 
            "apt_category" => "network_connection"
            "mitre_tactic" => "Command and Control"
          }
        }
      }
      
      # Process access (Event ID 10) - credential dumping indicator
      if [winlog][event_id] == 10 {
        mutate {
          add_field => { 
            "apt_category" => "process_access"
            "mitre_tactic" => "Credential Access"
          }
        }
        
        # Detect LSASS access
        if [winlog][event_data][TargetImage] =~ /(?i)lsass\.exe/ {
          mutate {
            add_field => { 
              "threat_detected" => "credential_dumping"
              "mitre_technique" => "T1003.001"
              "severity" => "critical"
            }
            add_tag => ["apt_detected", "credential_access"]
          }
        }
      }
      
      # File creation (Event ID 11)
      if [winlog][event_id] == 11 {
        mutate {
          add_field => { 
            "apt_category" => "file_creation"
          }
        }
      }
    }
    
    # Parse Security logs
    if [winlog][provider_name] == "Microsoft-Windows-Security-Auditing" {
      
      # Failed logon (Event ID 4625)
      if [winlog][event_id] == 4625 {
        mutate {
          add_field => { 
            "apt_category" => "failed_logon"
            "mitre_technique" => "T1110"
            "mitre_tactic" => "Credential Access"
          }
          add_tag => ["failed_login"]
        }
      }
      
      # Successful logon (Event ID 4624)
      if [winlog][event_id] == 4624 {
        mutate {
          add_field => { 
            "apt_category" => "successful_logon"
          }
        }
        
        # Detect lateral movement via network logon
        if [winlog][event_data][LogonType] == "3" or [winlog][event_data][LogonType] == "10" {
          mutate {
            add_field => { 
              "threat_detected" => "lateral_movement"
              "mitre_technique" => "T1021"
              "mitre_tactic" => "Lateral Movement"
              "severity" => "high"
            }
            add_tag => ["apt_detected", "lateral_movement"]
          }
        }
      }
      
      # Account logon (Event ID 4776)
      if [winlog][event_id] == 4776 {
        mutate {
          add_field => { 
            "apt_category" => "credential_validation"
          }
        }
      }
    }
    
    # Parse PowerShell logs
    if [winlog][provider_name] =~ /PowerShell/ {
      mutate {
        add_field => { 
          "apt_category" => "powershell_execution"
          "mitre_technique" => "T1059.001"
          "mitre_tactic" => "Execution"
        }
      }
      
      # Detect suspicious PowerShell patterns
      if [winlog][event_data][ScriptBlockText] {
        
        # Base64 encoded commands
        if [winlog][event_data][ScriptBlockText] =~ /(?i)-enc.*[A-Za-z0-9+\/]{50,}/ or 
           [winlog][event_data][ScriptBlockText] =~ /(?i)FromBase64String/ {
          mutate {
            add_field => { 
              "threat_detected" => "encoded_powershell"
              "severity" => "high"
            }
            add_tag => ["apt_detected", "suspicious_powershell"]
          }
        }
        
        # Download cradles
        if [winlog][event_data][ScriptBlockText] =~ /(?i)(Invoke-WebRequest|IWR|wget|curl|DownloadString|DownloadFile)/ {
          mutate {
            add_field => { 
              "threat_detected" => "powershell_download"
              "severity" => "medium"
            }
            add_tag => ["apt_detected", "powershell_download"]
          }
        }
        
        # Invoke-Expression or IEX
        if [winlog][event_data][ScriptBlockText] =~ /(?i)(Invoke-Expression|IEX)/ {
          mutate {
            add_tag => ["suspicious_powershell", "code_execution"]
          }
        }
      }
    }
  }
  
  # Parse network traffic logs
  if [type] == "packetbeat" {
    mutate {
      add_field => {
        "event_source" => "network"
        "log_type" => "packetbeat"
      }
    }
    
    # Detect unusual outbound traffic
    if [destination][port] and [network][bytes] {
      ruby {
        code => '
          bytes = event.get("[network][bytes]")
          if bytes && bytes > 10485760  # 10MB
            event.set("threat_detected", "data_exfiltration")
            event.set("mitre_technique", "T1041")
            event.set("mitre_tactic", "Exfiltration")
            event.set("severity", "critical")
            event.tag("apt_detected")
            event.tag("data_exfiltration")
          end
        '
      }
    }
    
    # Detect SMB traffic (lateral movement indicator)
    if [destination][port] == 445 or [destination][port] == 139 {
      mutate {
        add_field => { 
          "apt_category" => "smb_traffic"
          "mitre_technique" => "T1021.002"
        }
        add_tag => ["smb_traffic"]
      }
    }
    
    # Detect RDP traffic
    if [destination][port] == 3389 {
      mutate {
        add_field => { 
          "apt_category" => "rdp_traffic"
          "mitre_technique" => "T1021.001"
        }
        add_tag => ["rdp_traffic"]
      }
    }
  }
  
  # Parse file-based logs
  if [type] == "log" or [type] == "filebeat" {
    
    # Detect reconnaissance commands
    if [message] =~ /(?i)(whoami|ipconfig|netstat|net view|net user|nltest|dsquery)/ {
      mutate {
        add_field => { 
          "threat_detected" => "reconnaissance"
          "mitre_technique" => "T1087"
          "mitre_tactic" => "Discovery"
          "severity" => "medium"
        }
        add_tag => ["apt_detected", "reconnaissance"]
      }
    }
    
    # Detect credential access tools
    if [message] =~ /(?i)(mimikatz|procdump|gsecdump|wce\.exe|pwdump)/ {
      mutate {
        add_field => { 
          "threat_detected" => "credential_dumping_tool"
          "mitre_technique" => "T1003"
          "mitre_tactic" => "Credential Access"
          "severity" => "critical"
        }
        add_tag => ["apt_detected", "credential_dumping"]
      }
    }
  }
  
  # Add timestamp
  date {
    match => [ "[@timestamp]", "ISO8601" ]
    target => "@timestamp"
  }
  
  # Add GeoIP data for network events
  if [source][ip] {
    geoip {
      source => "[source][ip]"
      target => "[source][geo]"
    }
  }
  
  if [destination][ip] {
    geoip {
      source => "[destination][ip]"
      target => "[destination][geo]"
    }
  }
}

output {
  # Route threats to separate index
  if "apt_detected" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "apt-threats-%{+YYYY.MM.dd}"
    }
  }
  
  # Route all events to main index
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "apt-detection-%{+YYYY.MM.dd}"
  }
  
  # Debug output (optional, comment out in production)
  stdout {
    codec => rubydebug {
      metadata => true
    }
  }
}
