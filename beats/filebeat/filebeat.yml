filebeat.inputs:
  # System logs
  - type: log
    enabled: true
    paths:
      - /var/log/*.log
      - /var/log/syslog
      - /var/log/auth.log
    fields:
      log_type: system
      
  # Sample data logs
  - type: log
    enabled: true
    paths:
      - /sample-data/*.log
    fields:
      log_type: sample
    fields_under_root: true
    
  # JSON formatted logs
  - type: log
    enabled: true
    paths:
      - /sample-data/*.json
    json.keys_under_root: true
    json.add_error_key: true
    fields:
      log_type: sample_json
      
  # Process execution logs (simulated)
  - type: log
    enabled: true
    paths:
      - /sample-data/process-*.log
    fields:
      log_type: process_execution
      event_category: process
      
  # Command history logs
  - type: log
    enabled: true
    paths:
      - /sample-data/commands-*.log
    fields:
      log_type: command_execution
      event_category: shell
      
# Filebeat modules
filebeat.modules:
  - module: system
    syslog:
      enabled: true
    auth:
      enabled: true

# Processors for enrichment
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_cloud_metadata: ~
  - add_docker_metadata: ~
  - add_kubernetes_metadata: ~
  - add_fields:
      target: agent
      fields:
        type: filebeat
        
# Output to Logstash
output.logstash:
  hosts: ["logstash:5044"]
  
# Logging
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644
